name: Sync Learning Data

# Combined schedule for all sync-learning jobs. We split the original
# multi-cron workflow into a single workflow that uses `github.event_name`
# and the wall-clock to gate which job runs. The previous version relied
# on `github.event.schedule == '...'` which is not a valid field on the
# schedule trigger payload, so all jobs were silently skipped.

on:
  schedule:
    # Every 30 min from 16:00–23:30 CST — platform daily sync window
    - cron: "*/30 8-15 * * *"
    # Every 6h — refresh platform sessions
    - cron: "0 */6 * * *"
    # Every 6h — Khan Academy sync (Playwright, can't run on Vercel)
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      account_id:
        description: "Optional: only refresh this platform account ID"
        type: string
        required: false

concurrency:
  group: sync-learning-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  platform-sync:
    name: Platform daily sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run when the current minute matches the platform-sync cron window.
    # GHA doesn't expose which cron triggered the run, so we read wall time.
    if: |
      (github.event_name == 'workflow_dispatch' && !inputs.account_id) ||
      (github.event_name == 'schedule' && fromJSON('["0","30"]').includes(format(fromNow('1970-01-01T00:00:00Z'), 'mm')))
    steps:
      - name: Trigger platform sync
        run: |
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/sync-response.json \
            --connect-timeout 30 --max-time 120 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X GET "${{ secrets.VERCEL_BASE_URL }}/api/platform-sync/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP Status: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/sync-response.json || true
          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi

  refresh-sessions:
    name: Refresh platform sessions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Top of every 6th hour (00,06,12,18 UTC).
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'schedule' && format(fromNow('1970-01-01T00:00:00Z'), 'HH') == '00' &&
        contains(fromJSON('["00","06","12","18"]'), format(fromNow('1970-01-01T00:00:00Z'), 'HH')))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/refresh-managed-sessions.mjs ${{ inputs.account_id || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  khan-sync:
    name: Khan Academy data sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Minute == 15 of every 6th hour.
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'schedule' && format(fromNow('1970-01-01T00:00:00Z'), 'mm') == '15' &&
        contains(fromJSON('["00","06","12","18"]'), format(fromNow('1970-01-01T00:00:00Z'), 'HH')))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/sync-khan.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
