name: Sync Learning Data

on:
  schedule:
    # 16:00-23:45 CST = 08:00-15:45 UTC — 每天下午4点后每15分钟同步 IXL/Khan/RAZ/Epic
    - cron: "*/15 8-15 * * *"
    # 16:00 CST Mon = 08:00 UTC Mon — 每周刷新平台登录态
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  platform-sync:
    name: Platform daily sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 8-15 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger platform sync
        run: |
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/sync-response.json \
            --connect-timeout 30 --max-time 120 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X GET "${{ secrets.VERCEL_BASE_URL }}/api/platform-sync/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Response body:"
            cat /tmp/sync-response.json || true
            exit 1
          fi

  refresh-sessions:
    name: Refresh platform sessions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/refresh-managed-sessions.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
