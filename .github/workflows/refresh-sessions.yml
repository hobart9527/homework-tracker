name: Refresh Platform Sessions

# Decrypts platform credentials, runs Playwright headless login (stealth),
# and writes fresh cookies back to platform_accounts.managed_session_payload.
# Runs every 6 hours; data fetchers in platform-data-fetch.yml consume
# these sessions.

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      account_id:
        description: "Optional: only refresh this platform account ID"
        type: string
        required: false

concurrency:
  group: refresh-sessions
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh IXL + Khan sessions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh managed sessions
        run: node scripts/refresh-managed-sessions.mjs ${{ inputs.account_id || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
