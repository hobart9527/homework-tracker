name: Daily Reading Content

on:
  schedule:
    # Every day at 02:00 UTC (10:00 Beijing time)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate-en:
    name: Generate English articles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: PIPELINE_LANGUAGE=en PIPELINE_DAILY_LIMIT=2 PIPELINE_GRADES="3,4,5,6,7" npx tsx scripts/reading-content-pipeline.ts --daily
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_READING_MODEL: "MiniMax-M2.7"

  generate-zh:
    name: Generate Chinese articles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: PIPELINE_LANGUAGE=zh PIPELINE_DAILY_LIMIT=2 PIPELINE_GRADES="3,4,5,6,7" npx tsx scripts/reading-content-pipeline.ts --daily
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_READING_MODEL: "MiniMax-M2.7"
