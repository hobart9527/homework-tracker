name: Reading Content Pipeline

on:
  schedule:
    # 08:00 CST = 00:00 UTC — 每天生成文章 + 回填封面/插图
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  refresh-news:
    name: Generate articles from topics
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger refresh-news
        run: |
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/refresh-news-response.json \
            --connect-timeout 30 --max-time 180 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X GET "${{ secrets.VERCEL_BASE_URL }}/api/reading/refresh-news?concurrency=1&limit=5" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Response body:"
            cat /tmp/refresh-news-response.json || true
            exit 1
          fi

  backfill-images:
    name: Backfill cover images & illustrations
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsx scripts/backfill-reading-images.ts --limit=50
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
