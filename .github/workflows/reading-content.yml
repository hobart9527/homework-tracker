name: Reading Content Pipeline

on:
  schedule:
    # 08:00 CST = 00:00 UTC — 每天生成文章 + 回填封面/插图
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  refresh-news:
    name: Generate articles from topics
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger refresh-news
        run: |
          curl -s -f -X GET "${{ secrets.VERCEL_BASE_URL }}/api/reading/refresh-news?concurrency=3" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "%{http_code}"

  backfill-images:
    name: Backfill cover images & illustrations
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: [refresh-news]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/backfill-reading-images.ts --limit=10
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
