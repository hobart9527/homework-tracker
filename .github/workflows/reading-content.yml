name: Reading Content Pipeline

on:
  schedule:
    # 08:00 CST = 00:00 UTC — daily content generation
    # Use minute 7 to avoid GitHub scheduler peak-hour skip risk
    - cron: "7 0 * * *"
  workflow_dispatch:

jobs:
  generate-en:
    name: Generate English reading content
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install
      - run: PIPELINE_LANGUAGE=en npx tsx scripts/reading-content-pipeline.ts --scrape-first
        env:
          PIPELINE_GRADES: "3,4,5,6,7"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_READING_MODEL: "MiniMax-M2.7"

  generate-zh:
    name: Generate Chinese reading content
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install
      - run: PIPELINE_LANGUAGE=zh PIPELINE_GRADES=3,4,5,6,7 npx tsx scripts/reading-content-pipeline.ts --scrape-first
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_READING_MODEL: "MiniMax-M2.7"

  backfill-images:
    name: Backfill cover images & illustrations
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsx scripts/backfill-reading-images.ts --limit=50
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
