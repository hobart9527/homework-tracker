name: Reading Content Pipeline

on:
  schedule:
    # 08:00 CST = 00:00 UTC — 每天生成文章 + 回填封面/插图
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  refresh-news:
    name: Generate articles from topics
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger refresh-news
        run: |
          curl -s -f -X GET "${{ secrets.VERCEL_BASE_URL }}/api/reading/refresh-news?concurrency=3" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "%{http_code}"

  backfill-images:
    name: Backfill cover images & illustrations
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: [refresh-news]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger backfill-images
        run: |
          curl -s -f -X GET "${{ secrets.VERCEL_BASE_URL }}/api/reading/backfill-images?limit=10" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "%{http_code}"
