name: Reading Content Pipeline

on:
  schedule:
    # 1st of each month at 09:07 CST (01:07 UTC) — content refresh
    - cron: "7 1 1 * *"
  workflow_dispatch:

jobs:
  generate-en:
    name: Generate English reading content
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install
      - run: PIPELINE_LANGUAGE=en npx tsx scripts/reading-content-pipeline.ts --scrape-first
        env:
          PIPELINE_GRADES: "3,4,5,6,7"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # MINIMAX_API_KEY triggers direct MiniMax API in src/lib/reading/content-generator.ts.
          # When unset, the script falls back to OPENAI_READING_MODEL (a 9router alias).
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_READING_MODEL: ${{ secrets.OPENAI_READING_MODEL }}

  generate-zh:
    name: Generate Chinese reading content
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install
      - run: PIPELINE_LANGUAGE=zh PIPELINE_GRADES=3,4,5,6,7 npx tsx scripts/reading-content-pipeline.ts --scrape-first
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_READING_MODEL: ${{ secrets.OPENAI_READING_MODEL }}

  backfill-images:
    name: Backfill cover images & illustrations
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsx scripts/backfill-reading-images.ts --limit=50
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
